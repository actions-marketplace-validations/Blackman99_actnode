name: Release

on:
  push:
    tags: ["v*.*.*"]   # not the moving major tag (v0), which this workflow updates

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/actnode --version
          /tmp/v/bin/actnode demo
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=".github/release-notes/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          elif [ -f "$notes" ]; then
            gh release create "$TAG" dist/* --title "actnode ${TAG}" --notes-file "$notes"
          else
            gh release create "$TAG" dist/* --title "actnode ${TAG}" --generate-notes
          fi
      - name: Move the major tag (e.g. v0) to this release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
