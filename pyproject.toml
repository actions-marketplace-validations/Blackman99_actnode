[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "actnode"
version = "0.3.0"
description = "Find GitHub Actions steps still running on Node 20 (or older) and the release that moves each one to Node 24; optionally rewrite them."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Blackman99" }]
keywords = ["github-actions", "node24", "node20", "deprecation", "workflows", "ci", "devops", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://blackman99.github.io/actnode/"
Documentation = "https://blackman99.github.io/actnode/docs/"
Source = "https://github.com/Blackman99/actnode"
Issues = "https://github.com/Blackman99/actnode/issues"

[project.scripts]
actnode = "actnode.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/actnode"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
